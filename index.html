<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARROT.TV - Free Streaming Service Alternative</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #1B263B;
            --bg-darker: #0f172a;
            --accent-orange: #E07A5F;
            --accent-orange-light: #f09080;
            --accent-blue: #8D99AE;
            --text-light: #FFFFFF;
            --text-muted: #a8b2c1;
            --card-bg: rgba(27, 38, 59, 0.7);
            --border-subtle: rgba(141, 153, 174, 0.15);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        html {
            touch-action: manipulation;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #1B263B 50%, #0f172a 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ===== HEADER / NAVBAR ===== */
        header {
            background: linear-gradient(180deg, rgba(27, 38, 59, 0.95) 0%, rgba(27, 38, 59, 0.8) 100%);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 0 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            --logo-width: 300px;
            --logo-height: 150px;
            transition: var(--transition-smooth);
        }

        .brand:hover img {
            filter: brightness(1.1);
        }

        .brand img {
            width: var(--logo-width);
            height: var(--logo-height);
            object-fit: contain;
            transition: var(--transition-smooth);
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .nav-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
            background: none;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            position: relative;
        }

        .nav-link i {
            font-size: 1.4rem;
            transition: var(--transition-smooth);
        }

        .nav-link:hover {
            color: var(--accent-orange);
            background: rgba(224, 122, 95, 0.1);
            transform: translateY(-2px);
        }

        .nav-link.active {
            color: var(--accent-orange);
            background: rgba(224, 122, 95, 0.15);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 2px;
            background: var(--accent-orange);
            border-radius: 2px;
        }

        /* ===== MAIN CONTENT ===== */
        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== HERO & SEARCH ===== */
        .hero-search {
            text-align: center;
            margin-bottom: 3rem;
            width: 100%;
            max-width: 700px;
        }

        .hero-search h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(27, 38, 59, 0.8) 0%, rgba(27, 38, 59, 0.6) 100%);
            border: 2px solid var(--border-subtle);
            transition: var(--transition-smooth);
            overflow: hidden;
        }

        .search-box-wrapper:focus-within {
            border-color: var(--accent-orange);
            box-shadow: 0 20px 50px rgba(224, 122, 95, 0.3), inset 0 0 20px rgba(224, 122, 95, 0.05);
            background: linear-gradient(135deg, rgba(27, 38, 59, 0.9) 0%, rgba(27, 38, 59, 0.7) 100%);
        }

        .search-input {
            width: 100%;
            padding: 1.1rem 3.5rem 1.1rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-orange-light) 100%);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 12px rgba(224, 122, 95, 0.3);
        }

        .search-btn:hover {
            transform: translateY(-50%) scale(1.08);
            box-shadow: 0 8px 20px rgba(224, 122, 95, 0.4);
        }

        .search-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        /* ===== FILTER CHIPS ===== */
        .filter-container {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1.2rem;
        }

        .filter-chip {
            background: linear-gradient(135deg, rgba(27, 38, 59, 0.6) 0%, rgba(27, 38, 59, 0.4) 100%);
            border: 1.5px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 0.6rem 1.4rem;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .filter-chip:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(141, 153, 174, 0.1);
        }

        .filter-chip.active {
            background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-orange-light) 100%);
            color: white;
            border-color: var(--accent-orange);
            box-shadow: 0 4px 15px rgba(224, 122, 95, 0.3);
        }

        /* ===== RESULTS SECTION ===== */
        .results-section {
            width: 100%;
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .results-header {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 2rem;
            color: var(--text-light);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .panels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .source-panel {
            background: linear-gradient(135deg, rgba(27, 38, 59, 0.7) 0%, rgba(27, 38, 59, 0.5) 100%);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-subtle);
            position: relative;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 250px;
            cursor: pointer;
            padding: 2rem 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .source-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(224, 122, 95, 0.1) 0%, transparent 50%);
            opacity: 0;
            transition: var(--transition-smooth);
            pointer-events: none;
        }

        .source-panel:hover::before {
            opacity: 1;
        }

        .source-panel:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(224, 122, 95, 0.25);
            border-color: var(--accent-orange);
            background: linear-gradient(135deg, rgba(27, 38, 59, 0.85) 0%, rgba(27, 38, 59, 0.65) 100%);
        }

        .panel-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .panel-site-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        .panel-hint {
            font-size: 0.8rem;
            color: var(--accent-orange);
            opacity: 0;
            transition: var(--transition-smooth);
            font-weight: 600;
        }

        .source-panel:hover .panel-hint {
            opacity: 1;
        }

        /* ===== MODAL OVERLAY ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90vw;
            height: 85vh;
            background: linear-gradient(135deg, rgba(27, 38, 59, 0.95) 0%, rgba(27, 38, 59, 0.85) 100%);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid var(--accent-orange);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.8rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            padding: 0.5rem;
        }

        .modal-close:hover {
            color: var(--accent-orange);
            transform: rotate(90deg);
        }

        .modal-body {
            flex: 1;
            position: relative;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== DEV MODAL ===== */
        .dev-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
            backdrop-filter: blur(5px);
        }

        .dev-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .dev-modal-card {
            background: linear-gradient(135deg, #1B263B 0%, rgba(27, 38, 59, 0.8) 100%);
            border: 2px solid var(--accent-orange);
            padding: 2.5rem;
            border-radius: 16px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(224, 122, 95, 0.3);
        }

        .dev-modal-card i {
            font-size: 3.5rem;
            color: var(--accent-orange);
            margin-bottom: 1.5rem;
            display: block;
        }

        .dev-modal-card h3 {
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 1rem;
            color: var(--text-light);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .dev-modal-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .dev-modal-btn {
            background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-orange-light) 100%);
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 15px rgba(224, 122, 95, 0.3);
        }

        .dev-modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(224, 122, 95, 0.4);
        }

        /* ===== TABLET MODE (1024px and below) ===== */
        @media (max-width: 1024px) {
            .nav-container {
                padding: 0 1.5rem;
            }

            .brand {
                --logo-width: 200px;
                --logo-height: 100px;
            }

            .nav-links {
                gap: 2.5rem;
            }

            .nav-link {
                font-size: 0.85rem;
            }

            .hero-search h1 {
                font-size: 1.3rem;
            }

            .panels-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }

            .source-panel {
                height: 220px;
            }

            .panel-site-name {
                font-size: 1.3rem;
            }

            main {
                padding: 1.5rem 1rem;
            }

            .hero-search {
                max-width: 600px;
                margin-bottom: 2.5rem;
            }
        }

        /* ===== MOBILE MODE (768px and below) ===== */
        @media (max-width: 768px) {
            .nav-container {
                gap: 0.8rem;
                padding: 0 1rem;
            }

            .brand {
                --logo-width: 150px;
                --logo-height: 75px;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .nav-link {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
            }

            .hero-search h1 {
                font-size: 1.1rem;
            }

            .search-input {
                padding: 0.9rem 2.8rem 0.9rem 1rem;
                font-size: 0.9rem;
            }

            .search-btn {
                width: 35px;
                height: 35px;
            }

            .filter-chip {
                padding: 0.4rem 0.85rem;
                font-size: 0.75rem;
            }

            .panels-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .source-panel {
                height: 200px;
            }

            .panel-site-name {
                font-size: 1.1rem;
            }

            .modal-header {
                padding: 1.2rem 1.5rem;
            }

            .dev-modal-card {
                max-width: 90vw;
                padding: 2rem;
            }
        }

        /* ===== SMALL PHONES (480px and below) ===== */
        @media (max-width: 480px) {
            .nav-container {
                gap: 0.6rem;
                padding: 0 0.75rem;
            }

            .brand {
                --logo-width: 120px;
                --logo-height: 60px;
            }

            .nav-links {
                gap: 1rem;
            }

            .nav-link {
                font-size: 0.65rem;
                padding: 0.3rem 0.6rem;
            }

            .hero-search h1 {
                font-size: 0.95rem;
            }

            .search-input {
                padding: 0.8rem 2.5rem 0.8rem 1rem;
                font-size: 0.85rem;
            }

            .search-btn {
                width: 32px;
                height: 32px;
            }

            .filter-chip {
                padding: 0.3rem 0.7rem;
                font-size: 0.65rem;
            }

            .panels-grid {
                gap: 0.8rem;
            }

            .source-panel {
                height: 180px;
                padding: 1.2rem 0.8rem;
            }

            .panel-site-name {
                font-size: 1rem;
            }

            .results-header {
                font-size: 1.1rem;
            }

            .dev-modal-card {
                padding: 1.5rem;
            }

            .dev-modal-card i {
                font-size: 2.5rem;
            }

            .dev-modal-card h3 {
                font-size: 1.1rem;
            }
        }

        /* ===== LANDSCAPE & ZOOM DETECTION ===== */
        @media (max-height: 500px) and (orientation: landscape) {
            .brand {
                --logo-width: 120px;
                --logo-height: 60px;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .nav-link {
                font-size: 0.7rem;
            }

            .hero-search {
                margin-bottom: 1rem;
            }

            .source-panel {
                height: 160px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER / NAVBAR -->
    <header>
        <div class="nav-container">
            <a href="#" class="brand">
                <img src="https://i.ibb.co/9H2ZNhWB/1ptv.png" alt="PARROT.TV Logo">
            </a>
            <nav class="nav-links">
                <button class="nav-link" onclick="showDevNotice()" title="Movies">
                    <i class="fa-solid fa-film"></i>
                    <span>Movies</span>
                </button>
                <button class="nav-link" onclick="showDevNotice()" title="TV Shows">
                    <i class="fa-solid fa-tv"></i>
                    <span>TV Shows</span>
                </button>
                <button class="nav-link active" title="Anime">
                    <i class="fa-solid fa-fire"></i>
                    <span>Anime</span>
                </button>
                <button class="nav-link" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="Trending">
                    <i class="fa-solid fa-compass"></i>
                    <span>Trending</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <!-- HERO SEARCH SECTION -->
        <section class="hero-search">
            <h1>Find *All* Free Sources For Your Next Binge.</h1>
            <div class="search-box-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="[Enter Movie, Show, or Anime] e.g. Dragon Ball, Avatar...">
                <button class="search-btn" id="searchTriggerBtn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <!-- FILTER CHIPS -->
            <div class="filter-container" id="filterContainer">
                <div class="filter-chip active" data-site="all">All Sites</div>
                <div class="filter-chip active" data-site="miruro">Miruro</div>
                <div class="filter-chip active" data-site="mkissa">Mkissa</div>
                <div class="filter-chip active" data-site="kaa">Kaa.lt</div>
                <div class="filter-chip active" data-site="kissanime">KissAnime</div>
            </div>
        </section>

        <!-- RESULTS SECTION -->
        <section class="results-section" id="resultsSection">
            <div class="results-header">
                <span id="resultsTitle">Live Source Previews</span>
            </div>
            <div class="panels-grid" id="panelsGrid">
                <!-- SOURCE PANELS DYNAMICALLY INSERTED HERE -->
            </div>
        </section>
    </main>

    <!-- FULLSCREEN MODAL -->
    <div class="modal-overlay" id="fullscreenModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="font-family:'Montserrat',sans-serif; font-size:1.1rem; color:var(--accent-orange);">Source View</h3>
                <button class="modal-close" onclick="closeFullscreenModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <iframe id="modalIframe" src=""></iframe>
            </div>
        </div>
    </div>

    <!-- DEV NOTICE MODAL -->
    <div class="dev-modal" id="devModal">
        <div class="dev-modal-card">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Still Under Development</h3>
            <p>This section is currently being built. Expect updates around 2027!</p>
            <button class="dev-modal-btn" onclick="closeDevNotice()">Got It</button>
        </div>
    </div>

    <script>
        // ===== SOURCE CONFIGURATION =====
        const sources = [
            {
                name: 'Miruro',
                site: 'miruro',
                baseUrl: 'https://www.miruro.tv/search?query={query}&type=ANIME&sort=POPULARITY_DESC',
                getUrl: (query) => `https://www.miruro.tv/search?query=${encodeURIComponent(query).replace(/%20/g, '+')}&type=ANIME&sort=POPULARITY_DESC`
            },
            {
                name: 'Mkissa',
                site: 'mkissa',
                baseUrl: 'https://mkissa.to/search/anime?sortBy=Latest_Update&sortDirection=-1&query={query}&tr=sub&cty=ALL',
                getUrl: (query) => `https://mkissa.to/search/anime?sortBy=Latest_Update&sortDirection=-1&query=${encodeURIComponent(query).replace(/%20/g, '+')}&tr=sub&cty=ALL`
            },
            {
                name: 'Kaa.lt',
                site: 'kaa',
                baseUrl: 'https://kaa.lt/search?q={query}',
                getUrl: (query) => `https://kaa.lt/search?q=${encodeURIComponent(query)}`
            },
            {
                name: 'KissAnime',
                site: 'kissanime',
                baseUrl: 'https://kissanime.com.cv/?s={query}',
                getUrl: (query) => `https://kissanime.com.cv/?s=${encodeURIComponent(query)}`
            }
        ];

        // ===== INITIALIZE PANELS =====
        function initializePanels() {
            const panelsGrid = document.getElementById('panelsGrid');
            panelsGrid.innerHTML = '';

            sources.forEach(source => {
                const panel = document.createElement('div');
                panel.className = 'source-panel';
                panel.setAttribute('data-site-name', source.site);
                panel.innerHTML = `
                    <div class="panel-content">
                        <div class="panel-site-name">${source.name}</div>
                        <div class="panel-hint">Click to view results →</div>
                    </div>
                `;
                panel.onclick = () => navigateToSource(source);
                panelsGrid.appendChild(panel);
            });
        }

        // ===== NAVIGATE TO SOURCE =====
        function navigateToSource(source) {
            const query = searchInput.value.trim();
            if (!query) {
                alert('Please enter a search query first');
                return;
            }
            const url = source.getUrl(query);
            window.open(url, '_blank');
        }

        // ===== FILTER LOGIC =====
        const filterChips = document.querySelectorAll('.filter-chip');
        const panelsGrid = document.getElementById('panelsGrid');

        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                const site = chip.getAttribute('data-site');

                if (site === 'all') {
                    const isActive = chip.classList.toggle('active');
                    filterChips.forEach(c => {
                        if (c.getAttribute('data-site') !== 'all') {
                            isActive ? c.classList.add('active') : c.classList.remove('active');
                        }
                    });
                } else {
                    chip.classList.toggle('active');
                    const allIndividual = document.querySelectorAll('.filter-chip:not([data-site="all"])');
                    const allActive = Array.from(allIndividual).every(c => c.classList.contains('active'));
                    const allChip = document.querySelector('.filter-chip[data-site="all"]');
                    allActive ? allChip.classList.add('active') : allChip.classList.remove('active');
                }

                updatePanelVisibility();
            });
        });

        function updatePanelVisibility() {
            const activeSites = Array.from(document.querySelectorAll('.filter-chip:not([data-site="all"]).active'))
                .map(c => c.getAttribute('data-site'));

            document.querySelectorAll('.source-panel').forEach(panel => {
                const panelSite = panel.getAttribute('data-site-name');
                panel.style.display = activeSites.includes(panelSite) ? 'flex' : 'none';
            });
        }

        // ===== SEARCH EXECUTION =====
        const searchInput = document.getElementById('searchInput');
        const searchTriggerBtn = document.getElementById('searchTriggerBtn');
        const resultsSection = document.getElementById('resultsSection');

        function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsSection.classList.remove('active');
                return;
            }

            resultsSection.classList.add('active');
            setTimeout(() => {
                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        searchTriggerBtn.addEventListener('click', executeSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeSearch();
        });

        // ===== MODAL FUNCTIONS =====
        const fullscreenModal = document.getElementById('fullscreenModal');
        const modalIframe = document.getElementById('modalIframe');
        const modalTitle = document.getElementById('modalTitle');

        function openFullscreenModal(url, title) {
            if (!url) return;
            modalIframe.src = url;
            modalTitle.innerText = title;
            fullscreenModal.classList.add('active');
        }

        function closeFullscreenModal() {
            fullscreenModal.classList.remove('active');
            modalIframe.src = '';
        }

        // ===== DEV MODAL =====
        const devModal = document.getElementById('devModal');

        function showDevNotice() {
            devModal.classList.add('active');
        }

        function closeDevNotice() {
            devModal.classList.remove('active');
        }

        // ===== CLOSE MODALS ON BG CLICK =====
        window.addEventListener('click', (e) => {
            if (e.target === fullscreenModal) closeFullscreenModal();
            if (e.target === devModal) closeDevNotice();
        });

        // ===== INITIALIZE ON PAGE LOAD =====
        document.addEventListener('DOMContentLoaded', () => {
            initializePanels();
            updatePanelVisibility();
            clampZoom();
        });

        // ===== ZOOM CLAMPING (80% - 100%) =====
        function clampZoom() {
            const handleZoom = () => {
                const zoomLevel = (window.devicePixelRatio * 100);
                if (zoomLevel > 100) {
                    document.body.style.zoom = '100%';
                } else if (zoomLevel < 80) {
                    document.body.style.zoom = '80%';
                } else {
                    document.body.style.zoom = (zoomLevel / 100);
                }
            };

            window.addEventListener('resize', handleZoom);
            window.addEventListener('orientationchange', handleZoom);
            handleZoom();

            // Prevent zoom via pinch
            document.addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                }
            }, { passive: false });

            // Prevent zoom via +/- keys
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '0')) {
                    e.preventDefault();
                }
            });
        }
    </script>

</body>
</html>
